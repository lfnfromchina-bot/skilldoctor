[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-inspect"
version = "0.1.3"
description = "Scaffold, validate, lint and test agent skills (SKILL.md) — like unit tests for your skill descriptions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lfnfromchina-bot" }]
keywords = ["agent-skills", "claude-code", "skill", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "openai>=1",
    "questionary>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/lfnfromchina-bot/skilldoctor"

[project.scripts]
skilldoctor = "skilldoctor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/skilldoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
